name: Ryujinx source audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ryujinx-mirror-mirror-master.zip"
      - "Directory.Packages.props"
      - "global.json"
      - "nuget.config"
      - "patches/**"
      - "ryu/**"
      - ".github/workflows/ryujinx-source-audit.yml"

permissions:
  contents: read

jobs:
  inspect-original-source:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract source archive
        shell: bash
        run: |
          set -euo pipefail
          test -s ryujinx-mirror-mirror-master.zip
          unzip -tq ryujinx-mirror-mirror-master.zip
          mkdir -p source
          unzip -q ryujinx-mirror-mirror-master.zip -d source
          ROOT="$(find "$PWD/source" -type f -path '*/Ryujinx.HLE/Ryujinx.HLE.csproj' -print -quit)"
          if [ -z "$ROOT" ]; then
            echo "::error::Ryujinx.HLE/Ryujinx.HLE.csproj not found in source archive"
            find source -maxdepth 5 -type f | head -200
            exit 1
          fi
          ROOT="${ROOT%/Ryujinx.HLE/Ryujinx.HLE.csproj}"
          echo "RYUJINX_SOURCE_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Original source root: $ROOT"

      - name: Restore original Ryujinx build metadata
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REPO_ROOT="$(dirname "$RYUJINX_SOURCE_ROOT")"
          cp Directory.Packages.props "$SOURCE_REPO_ROOT/Directory.Packages.props"
          cp global.json "$SOURCE_REPO_ROOT/global.json"
          cp nuget.config "$SOURCE_REPO_ROOT/nuget.config"
          test -s "$SOURCE_REPO_ROOT/Directory.Packages.props"
          test -s "$SOURCE_REPO_ROOT/global.json"
          echo "Restored central package versions and .NET SDK metadata beside original src/."

      - name: Inject Android Vulkan surface implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RYUJINX_SOURCE_ROOT/Ryujinx.Graphics.Vulkan"
          cp ryu/src/Ryujinx.Graphics.Vulkan/AndroidVulkanSurface.cs "$RYUJINX_SOURCE_ROOT/Ryujinx.Graphics.Vulkan/AndroidVulkanSurface.cs"
          grep -q "VK_KHR_android_surface" "$RYUJINX_SOURCE_ROOT/Ryujinx.Graphics.Vulkan/AndroidVulkanSurface.cs"
          echo "Injected Android ANativeWindow Vulkan surface implementation."

      - name: Patch original VulkanRenderer for Android ANativeWindow
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REPO_ROOT="$(dirname "$RYUJINX_SOURCE_ROOT")"
          cd "$SOURCE_REPO_ROOT"
          patch --batch --forward -p1 < "$GITHUB_WORKSPACE/patches/0002-vulkan-wire-android-window-into-original-renderer.patch"
          grep -q "IntPtr androidNativeWindow" "$RYUJINX_SOURCE_ROOT/Ryujinx.Graphics.Vulkan/VulkanRenderer.cs"
          echo "Original VulkanRenderer now has an Android ANativeWindow constructor."

      - name: Build original HLE and Vulkan projects (Android surface integration)
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REPO_ROOT="$(dirname "$RYUJINX_SOURCE_ROOT")"
          cd "$SOURCE_REPO_ROOT"
          dotnet --info
          dotnet restore "$RYUJINX_SOURCE_ROOT/Ryujinx.HLE/Ryujinx.HLE.csproj"
          dotnet build "$RYUJINX_SOURCE_ROOT/Ryujinx.HLE/Ryujinx.HLE.csproj" --no-restore --configuration Release
          dotnet restore "$RYUJINX_SOURCE_ROOT/Ryujinx.Graphics.Vulkan/Ryujinx.Graphics.Vulkan.csproj"
          dotnet build "$RYUJINX_SOURCE_ROOT/Ryujinx.Graphics.Vulkan/Ryujinx.Graphics.Vulkan.csproj" --no-restore --configuration Release

      - name: Build Android ANativeWindow JNI bridge for ARM64
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;27.2.12479018"
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          cmake -S ryu/android/native -B build/android-native -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared
          cmake --build build/android-native --config Release
          test -s build/android-native/libryujinx_android.so
          mkdir -p audit/android-arm64
          cp build/android-native/libryujinx_android.so audit/android-arm64/
          file audit/android-arm64/libryujinx_android.so

      - name: Inventory original projects and Android blockers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          {
            echo "# Ryujinx original source audit"
            echo
            echo "- Archive: `ryujinx-mirror-mirror-master.zip`"
            echo "- Source root: `$RYUJINX_SOURCE_ROOT`"
            echo
            echo "## Project files"
            find "$RYUJINX_SOURCE_ROOT" -name '*.csproj' -type f | sort
            echo
            echo "## Target frameworks"
            grep -RhsE '<TargetFrameworks?>' "$RYUJINX_SOURCE_ROOT" --include='*.csproj' | sort -u || true
            echo
            echo "## Android / native / graphics references"
            grep -RInsE 'OpenTK.Windowing|GLFW|Silk.NET.Vulkan|VulkanRenderer|DllImport|LibraryImport|RuntimeIdentifier|RuntimeIdentifiers' "$RYUJINX_SOURCE_ROOT" --include='*.cs' --include='*.csproj' | head -500 || true
            echo
            echo "## Required core projects"
            for project in Ryujinx.HLE/Ryujinx.HLE.csproj Ryujinx.Graphics.GAL/Ryujinx.Graphics.GAL.csproj Ryujinx.Graphics.Vulkan/Ryujinx.Graphics.Vulkan.csproj Ryujinx.Audio/Ryujinx.Audio.csproj Ryujinx.Cpu/Ryujinx.Cpu.csproj ARMeilleure/ARMeilleure.csproj; do
              if [ -f "$RYUJINX_SOURCE_ROOT/$project" ]; then
                echo "FOUND $project"
              else
                echo "MISSING $project"
              fi
            done
          } > audit/source-audit.md
          cat audit/source-audit.md

      - name: Package original source for implementation review
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$PWD/audit/ryujinx-source-review.tar.gz" -C "$RYUJINX_SOURCE_ROOT" .

      - name: Upload source audit and review snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ryujinx-original-source-audit
          path: |
            audit/source-audit.md
            audit/ryujinx-source-review.tar.gz
          if-no-files-found: error
          retention-days: 14
